[project]
name = "econ-sim"
version = "0.1.0"
description = "Month-by-month economic simulation, starting with a village of 100 people"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
charts = ["matplotlib>=3.8"]
dev = ["pytest>=8", "matplotlib>=3.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["econ_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
