[workspace]
members = ["econ-core", "econ-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
rand = "0.8"
rand_distr = "0.4"
rand_xoshiro = "0.6"
crc32fast = "1"
libm = "0.2"
rayon = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
debug = 1
# The whole engine optimised as one unit: about a tenth faster.
lto = "fat"
codegen-units = 1

[profile.test]
opt-level = 2
